<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Reset XP</title></head>
<body>
<script>
localStorage.setItem('totalXP','0');
localStorage.setItem('fluentge-xp','0');
localStorage.setItem('currentStreak','0');
localStorage.setItem('gamesPlayed','0');
localStorage.removeItem('lastPracticeDate');
localStorage.removeItem('streakLastDate');
localStorage.removeItem('fluentge-daily-history');
localStorage.removeItem('fluentge-daily');
localStorage.setItem('xp-just-reset','1');

// Also reset Firebase
(async () => {
  try {
    const {initializeApp,getApps} = await import('https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js');
    const {getAuth,onAuthStateChanged} = await import('https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js');
    const {getFirestore,doc,setDoc} = await import('https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js');
    const app = getApps().length ? getApps()[0] : initializeApp({
      apiKey:'AIzaSyBkkidqxa8Wnt89Gvp9zb5F0USz3D9VKKY',
      authDomain:'fluentge.firebaseapp.com',
      projectId:'fluentge',
      storageBucket:'fluentge.firebasestorage.app',
      messagingSenderId:'310749638702',
      appId:'1:310749638702:web:af06277b9f26fcaab93c48'
    });
    const auth = getAuth(app);
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const db = getFirestore(app);
        await setDoc(doc(db,'users',user.uid), {totalXP:0,currentStreak:0,lastPracticeDate:'',dailyHistory:{},gamesPlayed:0}, {merge:true});
      }
      document.body.innerHTML = '<h1 style="text-align:center;margin-top:40vh;font-family:sans-serif">✅ XP განულდა! გადამისამართება...</h1>';
      setTimeout(() => { window.location.href = '/dashboard/'; }, 1500);
    });
  } catch(e) {
    document.body.innerHTML = '<h1 style="text-align:center;margin-top:40vh;font-family:sans-serif">✅ XP განულდა! გადამისამართება...</h1>';
    setTimeout(() => { window.location.href = '/dashboard/'; }, 1500);
  }
})();
</script>
</body>
</html>
